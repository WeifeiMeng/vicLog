services:
  viclog:
    image: "viclog:about-dynamic-5f40d33"
    container_name: viclog
    restart: unless-stopped
    user: "${VICLOG_UID}:${VICLOG_GID}"
    env_file:
      - /opt/viclog/.env.local
    environment:
      NODE_ENV: "production"
      HOSTNAME: "0.0.0.0"
      PORT: "3000"
      HOME: "/tmp"
      CONTENT_ROOT: "/workspace/content"
      REPO_ROOT: "/workspace"
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: "safe.directory"
      GIT_CONFIG_VALUE_0: "/workspace"
    ports:
      - "3001:3000"
    volumes:
      - "/opt/viclog:/workspace"
    tmpfs:
      - "/tmp:size=64m,mode=1777"
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 256
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
