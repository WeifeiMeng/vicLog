name: Deploy blog content

on:
  push:
    branches: [main]
    paths:
      - "content/**"
      - "scripts/validate-content.mjs"
      - "scripts/validate-content.test.ts"
      - "package.json"
      - ".github/workflows/deploy-content.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: viclog-content-production
  cancel-in-progress: false

jobs:
  sync-content:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate Markdown content
        id: content_validation
        run: |
          set -o pipefail
          npm run validate:content 2>&1 | tee content-validation.log

      - name: Explain content validation failure
        if: failure() && steps.content_validation.outcome == 'failure'
        run: |
          {
            echo "## Content validation failed"
            echo
            echo "The server was not updated. Fix the Markdown frontmatter error below and push again:"
            echo
            echo '```text'
            cat content-validation.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Configure SSH
        env:
          DEPLOY_KEY: ${{ secrets.VICLOG_DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.VICLOG_SSH_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/viclog_deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/viclog_deploy ~/.ssh/known_hosts

      - name: Sync published content
        run: |
          ssh -T \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -i ~/.ssh/viclog_deploy \
            root@123.56.122.63 sync-viclog-content
